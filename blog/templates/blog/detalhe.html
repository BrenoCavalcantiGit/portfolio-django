{% extends 'blog/base.html' %}

{% block title %}{{ post.title }} | Meu Portfólio{% endblock %}

{% block content %}
  <article class="post">
    <h1>{{ post.title }}</h1>
    <p class="meta">Por {{ post.author }} em {{ post.created_at|date:"d/m/Y" }}</p>
    {{ post.content|linebreaks }}
  </article>

  <p><a class="voltar" href="{% url 'index' %}">&larr; Voltar para os posts</a></p>
{% endblock %}
