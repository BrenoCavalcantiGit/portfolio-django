<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Meu Portfólio{% endblock %}</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background-color: #f4f4f8;
        color: #222;
      }

      .topo {
        background-color: #2b2d42;
        padding: 20px 0;
        text-align: center;
      }

      .topo a {
        color: #fff;
        font-size: 24px;
        font-weight: bold;
        text-decoration: none;
      }

      .layout {
        display: grid;
        grid-template-columns: 3fr 1fr;
        gap: 24px;
        max-width: 1000px;
        margin: 32px auto;
        padding: 0 16px;
      }

      .conteudo h1 {
        margin-bottom: 24px;
        color: #2b2d42;
      }

      .post {
        background-color: #fff;
        padding: 20px;
        margin-bottom: 16px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }

      .post h2 a {
        color: #2b2d42;
        text-decoration: none;
      }

      .post h2 a:hover {
        color: #8d99ae;
      }

      .meta {
        font-size: 13px;
        color: #777;
        margin: 8px 0 12px;
      }

      .sidebar section {
        background-color: #fff;
        padding: 20px;
        margin-bottom: 16px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }

      .sidebar h3 {
        margin-bottom: 12px;
        color: #2b2d42;
      }

      .sidebar li {
        list-style: none;
        margin-bottom: 8px;
      }

      .sidebar a,
      .voltar {
        color: #2b2d42;
      }

      footer {
        text-align: center;
        padding: 24px 0;
        color: #777;
        font-size: 14px;
      }

      @media (max-width: 768px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="topo">
      <a href="{% url 'index' %}">Meu Portfólio</a>
    </header>

    <div class="layout">
      <main class="conteudo">
        {% block content %}{% endblock %}
      </main>

      <aside class="sidebar">
        {% include 'blog/sidebar.html' %}
      </aside>
    </div>

    <footer>
      <p>Portfólio desenvolvido com Django</p>
    </footer>
  </body>
</html>
